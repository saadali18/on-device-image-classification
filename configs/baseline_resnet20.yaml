experiment_name: baseline_resnet20_cifar100

seed: 42

device: auto

dataset:
  name: cifar100
  data_dir: ./data
  num_classes: 100
  num_workers: 0

model:
  name: resnet20
  width: 16

training:
  epochs: 100
  batch_size: 128
  optimizer: sgd
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 0.0005

scheduler:
  name: multistep
  milestones: [60, 80]
  gamma: 0.1

loss:
  name: cross_entropy

output:
  checkpoint_dir: ./checkpoints/baseline/resnet20
  result_dir: ./results/baseline/resnet20
  plot_dir: ./plots/baseline/resnet20